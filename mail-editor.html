<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>E-mail designer · Maxzz admin</title>
<link rel="stylesheet" href="/js/vendor/grapes.min.css?v=1">
<style>
/* The designer runs inside the admin (in a frame). Only the canvas of GrapesJS is used: its own panels are hidden and
   the side bar (blocks to add, style of the selected element) is ours, in the look of the admin. */
:root{--ink:#1d2126;--mut:#5f656c;--line:#e3e6e9;--soft:#f4f5f6;--red:#d32a37;--gjs-primary-color:#fff;--gjs-secondary-color:#1d2126;--gjs-tertiary-color:#d32a37;--gjs-quaternary-color:#d32a37;--gjs-color-blue:#d32a37;--gjs-font-color:#1d2126}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:#e9ebee;font-size:14px}
button,input,select{font:inherit;color:inherit}
.top{height:60px;display:flex;align-items:center;gap:10px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line)}
.top b{font-size:15px}.top .sp{flex:1}.top small{color:var(--mut);font-size:12.5px}
.btn{height:38px;border-radius:999px;border:1px solid #c9ced3;background:#fff;color:var(--ink);padding:0 16px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}.btn:hover{border-color:var(--ink)}.btn.red{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}.btn.red:hover{background:#b71f2b}.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}.btn.ic{width:38px;padding:0;display:inline-flex;align-items:center;justify-content:center}.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn svg{width:17px;height:17px;display:block}
.seg{display:inline-flex;background:#f1f2f4;border-radius:999px;padding:3px}.seg button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;color:#3a4048;display:inline-flex;align-items:center;justify-content:center;gap:6px}.seg button.on{background:var(--ink);color:#fff}.seg svg{width:16px;height:16px;pointer-events:none}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 348px;height:calc(100% - 60px)}
#gjs{height:100%;min-width:0}
.side{background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:10px 14px;border-bottom:1px solid var(--line)}.tabs button{height:36px;border:0;border-radius:999px;background:transparent;font-weight:600;font-size:13.5px;color:var(--mut);cursor:pointer}.tabs button.on{background:var(--ink);color:#fff}
.pane{flex:1;overflow:auto;min-height:0;display:none}.pane.on{display:block}
/* GrapesJS: only the canvas stays */
.gjs-pn-panels,.gjs-pn-panel{display:none!important}.gjs-editor{background:#e9ebee!important}.gjs-cv-canvas{width:100%!important;height:100%!important;top:0!important;left:0!important;background:#e9ebee!important}
.gjs-toolbar{background:var(--ink);border-radius:8px;padding:2px}.gjs-badge{background:var(--ink);border-radius:6px;font-family:inherit}.gjs-rte-toolbar{background:var(--ink);border-radius:8px;border:0}.gjs-rte-action{color:#fff;border-right-color:rgba(255,255,255,.15)}.gjs-rte-active{background:rgba(255,255,255,.18)}
.gjs-mdl-dialog{background:#fff!important;color:var(--ink)!important;border-radius:16px}.gjs-mdl-header{border-bottom-color:var(--line)}
/* blocks to add */
#blocks .gjs-blocks-cs,#blocks .gjs-block-categories{background:#fff!important}
#blocks .gjs-block-category{border:0;background:#fff!important}
#blocks .gjs-block-category .gjs-title{background:#fff!important;border:0;color:var(--mut)!important;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:16px 16px 6px;cursor:default}#blocks .gjs-caret-icon{display:none}
#blocks .gjs-blocks-c{display:grid!important;grid-template-columns:1fr 1fr;gap:10px;padding:4px 14px 10px;background:#fff!important}
#blocks .gjs-block{width:auto;min-height:0;margin:0;padding:8px 8px 9px;border:1px solid var(--line);border-radius:14px;box-shadow:none;background:#fff!important;color:var(--ink)!important;cursor:grab;transition:border-color .15s,transform .15s,box-shadow .15s;flex-direction:column;gap:7px}
#blocks .gjs-block:hover{border-color:var(--ink);transform:translateY(-1px);box-shadow:0 6px 16px rgba(20,24,28,.08)}
#blocks .gjs-block__media{width:100%;margin:0}#blocks .gjs-block__media svg{width:100%;height:auto;display:block;border-radius:9px}
#blocks .gjs-block-label{font-size:12.5px;font-weight:600;font-family:inherit;line-height:1.25;text-align:left;padding:0 2px}
.hint{margin:6px 14px 18px;padding:12px 14px;border-radius:12px;background:var(--soft);color:var(--mut);font-size:12.5px;line-height:1.5}
/* style of the selected element */
.st-e{padding:40px 22px;text-align:center;color:var(--mut);line-height:1.5}.st-e b{display:block;color:var(--ink);font-size:15px;margin:0 0 6px}
.st-h{padding:14px 16px 12px;border-bottom:1px solid var(--line)}.st-h h3{margin:0;font-size:16px}
.crumb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:0 0 8px;font-size:12px;color:var(--mut)}.crumb button{border:0;background:var(--soft);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--mut)}.crumb button:hover{color:var(--ink);background:#e7e9ec}.crumb span{padding:4px 10px;border-radius:999px;background:var(--ink);color:#fff}
.st-a{display:flex;gap:6px;margin:10px 0 0;flex-wrap:wrap}
.grp{padding:14px 16px 6px;border-bottom:1px solid var(--line)}.grp h4{margin:0 0 12px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.row{margin:0 0 14px}.row>label{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:500;margin:0 0 7px}.row>label em{font-style:normal;color:var(--mut);font-weight:400;font-size:12px}
.row input[type=text],.row input[type=url]{width:100%;height:38px;border:1px solid #c9ced3;border-radius:10px;padding:0 12px;background:#fff}.row input:focus{outline:2px solid rgba(211,42,55,.25);border-color:var(--red)}
.sl{display:flex;align-items:center;gap:10px}.sl input[type=range]{flex:1;min-width:0;accent-color:var(--red);height:4px}.nb{display:inline-flex;align-items:center;border:1px solid #c9ced3;border-radius:10px;height:36px;padding:0 8px;background:#fff;flex:none}.nb input{width:38px;border:0;outline:0;text-align:right;background:transparent;-moz-appearance:textfield;padding:0}.nb input::-webkit-outer-spin-button,.nb input::-webkit-inner-spin-button{-webkit-appearance:none}.nb i{font-style:normal;color:var(--mut);font-size:12px;margin-left:3px}
.lk{width:36px;height:36px;border-radius:10px;border:1px solid #c9ced3;background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--mut);align-self:flex-start}.lk svg{width:17px;height:17px;pointer-events:none}.lk.on{background:var(--ink);border-color:var(--ink);color:#fff}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1}.four div{text-align:center}.four .nb{width:100%;justify-content:center;padding:0 4px}.four .nb input{width:100%;text-align:center}.four small{display:block;margin:4px 0 0;font-size:10.5px;color:var(--mut);letter-spacing:.04em;text-transform:uppercase}
.sw{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.sw button{width:28px;height:28px;border-radius:999px;border:1px solid rgba(0,0,0,.14);cursor:pointer;padding:0;position:relative}.sw button.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}.sw button.no{background:#fff linear-gradient(135deg,transparent 46%,#d32a37 46%,#d32a37 54%,transparent 54%)}.sw label{width:28px;height:28px;border-radius:999px;border:1px dashed #9aa1a9;cursor:pointer;position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;color:var(--mut);font-size:16px;line-height:1}.sw label input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.row .seg{display:flex}.row .seg button{flex:1;padding:8px 6px}
/* product picker */
.pk{position:fixed;inset:0;background:rgba(20,24,28,.45);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}.pk.on{display:flex}
.pk-b{background:#fff;border-radius:20px;width:min(1020px,100%);max-height:94vh;display:flex;flex-direction:column;overflow:hidden}
.pk-h{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid #eef0f2}.pk-h b{font-size:17px}.pk-h .sp{flex:1}
.pk-m{display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:0;flex:1}.pk-c{padding:16px 22px;overflow:auto;min-height:280px;max-height:48vh}.pk-c+.pk-c{border-left:1px solid #eef0f2;background:#fafbfc}
.pk-c h4{margin:0 0 10px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.pk input[type=search],.pk input[type=text]{width:100%;border:1px solid #c9ced3;border-radius:12px;padding:10px 12px;background:#fff}
.pk-r{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #eef0f2}.pk-r img{width:56px;height:42px;border-radius:8px;background:#f1f2f4;flex:none;display:block}.pk-r div{flex:1;min-width:0}.pk-r b{display:block;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}.pk-r span{display:block;font-size:13px;color:#3a4048;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-x{border:1px solid var(--line);background:#fff;border-radius:999px;width:30px;height:30px;cursor:pointer;flex:none}.pk-x:hover{border-color:var(--ink)}.pk-x[disabled]{opacity:.3}
.pk-o{display:grid;grid-template-columns:auto 1fr;gap:14px 26px;padding:16px 22px;border-top:1px solid #eef0f2;align-items:start}.pk-o>div>label{display:block;font-size:12.5px;color:var(--mut);margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:1px solid #c9ced3;background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--mut)}.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pk-f{display:flex;gap:12px;align-items:center;padding:14px 22px;border-top:1px solid #eef0f2}.pk-f .sp{flex:1}.pk-f small{color:var(--mut)}
.pk-e{color:#8a9097;font-size:13px;padding:18px 0}
#boot{position:fixed;inset:0;z-index:99999;background:#e9ebee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--mut)}#boot i{width:34px;height:34px;border-radius:50%;border:3px solid #cfd3d8;border-top-color:var(--red);animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="boot"><i></i><span>Opening the designer…</span></div>
<div class="top"><b>E-mail designer</b><small>Drag blocks into the e-mail. Click any element to change it.</small><span class="sp"></span>
<div class="seg" id="dev"><button data-d="Desktop" class="on">Desktop</button><button data-d="Mobile portrait">Phone</button></div>
<button class="btn" id="hdr" title="Use the standard header, or leave it out to start the e-mail with your own picture">Standard header: on</button><button class="btn ic" id="undo" title="Undo" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button><button class="btn ic" id="redo" title="Redo" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
<button class="btn" id="cancel">Cancel</button><button class="btn red" id="done">Use this design</button></div>
<div class="wrap"><div id="gjs"></div>
<aside class="side"><div class="tabs"><button id="t-add" class="on">Add</button><button id="t-style">Style</button></div>
<div class="pane on" id="p-add"><div id="blocks"></div><p class="hint">The header and the footer are the same in every e-mail. Change them in Email campaigns, "Header and footer".</p></div>
<div class="pane" id="p-style"></div></aside></div>
<div class="pk" id="pk"><div class="pk-b">
<div class="pk-h"><b>Products in this block</b><span class="sp"></span><button class="pk-x" id="pk-close" aria-label="Close">×</button></div>
<div class="pk-m"><div class="pk-c"><h4>Find a part</h4><input type="search" id="pk-q" placeholder="Part number, description or engine"><div id="pk-res"></div></div>
<div class="pk-c"><h4>In the e-mail, in this order</h4><div id="pk-sel"></div></div></div>
<div class="pk-o"><div><label>Layout</label><div class="seg" id="pk-lay"><button data-v="list">List</button><button data-v="grid2">2 columns</button><button data-v="grid3">3 columns</button><button data-v="hero">Featured</button></div></div>
<div><label>What each part shows</label><div class="chips" id="pk-show"><button data-h="photo">Photo</button><button data-h="code">Part number</button><button data-h="cat">Category and brand</button><button data-h="app">Application</button><button data-h="price">Price of each customer</button><button data-h="cta">Button</button></div></div></div>
<div class="pk-f"><small>Button text</small><input type="text" id="pk-cta" maxlength="40" style="width:170px"><span class="sp"></span><button class="btn dark" id="pk-ok">Save block</button></div>
</div></div>
<script src="/js/vendor/grapes.min.js?v=1"></script>
<script src="/js/vendor/grapesjs-preset-newsletter.js?v=1"></script>
<script src="/js/mail-sections.js?v=4"></script>
<script>
(function () {
  var F = 'Helvetica,Arial,sans-serif', ORIGIN = location.origin, SX = window.MXSections, S = SX.S;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function call(a, body) { return fetch('/api/admin?a=' + a, { method: body ? 'POST' : 'GET', credentials: 'same-origin', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined }).then(function (r) { return r.json().catch(function () { return {}; }); }); }

      }
