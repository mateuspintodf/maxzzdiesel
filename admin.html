:root{--mo-open:250ms;--mo-close:150ms;--mo-ease:cubic-bezier(.22,1,.36,1);--mo-scale:.96;--ground:#dedede;--card:#fff;--soft:#f1f1f2;--ink:#1d2126;--ink2:#5a5a60;--muted:#67676e;--line:#e4e4e6;--line2:#efeff0;--red:#d32a37;--orange:#fc771d;--acc:#fc771d;--accs:#ffeadb;--ok:#1f8a4c;--oks:#e3f4e9;--warn:#b86a0b;--warns:#fdf0dc;--blue:#1e1e87;--blues:#e6e6f4;--font:'BDO Grotesk','Helvetica Neue',Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--r:24px}
