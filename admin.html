<style>

:root{--ground:#f3f4f6;--card:#fff;--ink:#1a1e23;--ink2:#4b525b;--muted:#7c838c;--line:#e7e9ec;--line2:#f0f1f3;--red:#d32a37;--orange:#fc771d;--ok:#1f8a4c;--warn:#b86a0b;--blue:#2c5fb3;--side:#121519;--font:'BDO Grotesk','Helvetica Neue',Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}

.page{padding:22px 28px 60px;max-width:1440px}

.lnk{border:0;background:none;color:var(--blue);cursor:pointer;padding:4px;font-size:13px}.lnk.red{color:var(--red);margin-top:10px}

.kpi small{font-size:12px;color:var(--muted);font-weight:500}.kpi b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;margin:4px 0 4px}.kpi .ks{font-size:12px;color:var(--muted);position:relative;z-index:1}.kpi .ks a{color:var(--blue);cursor:pointer;text-decoration:none}

.note{display:flex;align-items:center;gap:12px;background:#fff8ec;border:1px solid #f4dfb8;color:#6b4a12;border-radius:12px;padding:11px 14px;margin:0 0 16px;font-size:13px}.note span{flex:1}
.alert{background:#fdecee;border:1px solid #f5c6cb;color:var(--red);border-radius:12px;padding:11px 14px;margin:0 0 16px}
.empty{color:var(--muted);font-size:13px;padding:14px 0}
svg.chart{width:100%;height:auto;display:block}.chart .b1{fill:var(--ink)}.chart .b0{fill:#cfd3d8}.chart .gl{stroke:var(--line2);stroke-width:1}.chart .gt{font-size:12px;fill:#9aa0a8}
.br{margin:0 0 10px}.bt{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin:0 0 4px}.bt small{color:var(--muted)}.bw{background:var(--line2);border-radius:4px;height:6px;overflow:hidden}.bw i{display:block;height:100%;background:var(--ink);border-radius:4px}
.hb{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;margin:2px 0 14px}.hb i{display:block}

.st:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--c)}
.st.portal{--c:var(--orange);background:#fff1e7;color:#a14a0c}.st.live{--c:var(--ok);background:#e5f4ea;color:var(--ok)}
.pill{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;background:#f1f2f4}.pill.pending{background:#fdf0dc;color:var(--warn)}.pill.approved{background:#e5f4ea;color:var(--ok)}.pill.rejected{background:#fdecee;color:var(--red)}

.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:8px 10px;border-top:1px solid var(--line2);vertical-align:top}
.dt{min-width:640px}.g2 .dt,.g3 .dt,.g21 .dt,.drawer .dt{min-width:0}
.dt th{position:sticky;top:0;background:#fafbfc;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-top:0;border-bottom:1px solid var(--line);white-space:nowrap}
.card.flush .dt td:first-child,.card.flush .dt th:first-child{padding-left:20px}.card.flush .dt td:last-child,.card.flush .dt th:last-child{padding-right:20px}
.dt th button{border:0;background:none;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:3px}.dt th button.on{color:var(--ink)}
.dt td{vertical-align:middle}.dt td.nw,.dt td:has(>.st){white-space:nowrap}.dt td small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.dt .r{text-align:right}.dt .b{font-weight:600}.dt th.r button{justify-content:flex-end}
.dt.click tbody tr{cursor:pointer}.dt.click tbody tr:hover td{background:#f8f9fa}
.fbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line)}.fbar h2{margin-right:8px}.fbar .sp{flex:1}.fbar .srch{min-width:200px}
.more{padding:14px;text-align:center;border-top:1px solid var(--line2)}

.act{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:12px;padding:12px 0;border-top:1px solid var(--line2);align-items:start}.act:first-child{border-top:0;padding-top:0}
.ab b{font-size:14px}.ab p{margin:3px 0 0;color:var(--ink2);font-size:13px}.ab p.todo{color:var(--ink)}.ab small{display:block;margin-top:4px;color:var(--muted);font-size:12px}.aa{display:flex;gap:6px}
.ch2{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:3px 7px;background:#f1f2f4;color:var(--ink2);text-align:center}
.ch2.call{background:#fdf0dc;color:var(--warn)}.ch2.campaign{background:#e8effb;color:var(--blue)}.ch2.content{background:#e5f4ea;color:var(--ok)}.ch2.review{background:#f1f2f4}
.ai{background:linear-gradient(160deg,#171a1f,#22272e);color:#e8eaed;border-color:#2a3038}.ai h2,.ai h3{color:#fff}.ai h2 svg{color:var(--orange)}.ai .muted{color:#9aa1aa}.ai .lead{font-size:14px;line-height:1.5}.ai h3{margin:16px 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#9aa1aa}
.aig{display:grid;grid-template-columns:1fr;gap:4px}.ai1{border-top:1px solid #30363e;padding:10px 0}.ai1 p{margin:4px 0;color:#d5d9de}.ai1 small{color:#9aa1aa}.ai .ch2{margin-right:6px}.msg{margin-top:8px;padding:10px 12px;border-radius:10px;background:#111418;font-size:12.5px;white-space:pre-wrap;color:#d5d9de}
.fun>div{position:relative;display:grid;grid-template-columns:1fr auto 44px;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line2)}.fun>div:first-child{border-top:0}.fun i{grid-column:1 / -1;height:6px;border-radius:4px;background:var(--ink);display:block}.fun small{color:var(--muted);text-align:right}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:#fff;z-index:61;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.18);animation:sl .25s cubic-bezier(.2,.9,.25,1)}

.dbody{flex:1;overflow-y:auto;padding:0 22px 22px}
.dsec{padding:16px 0;border-bottom:1px solid var(--line2)}.dsec h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}

.pp{display:flex;align-items:center;gap:10px;padding:8px 0}.pp>span:nth-child(2){flex:1;min-width:0}.pp b{display:block;font-size:13.5px}.pp small{color:var(--muted);font-size:12px}
.apv{background:#fafbfc;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}.apv .row{display:flex;gap:8px;margin-top:8px}.apv .row input{flex:1}
.hit{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;margin-top:8px}.hit small{display:block;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0}.tl li{display:flex;gap:10px;padding:6px 0}.tl i{width:8px;height:8px;border-radius:50%;background:var(--orange);margin-top:6px;flex:none}.tl small{display:block;color:var(--muted);font-size:11.5px}
.dfoot{display:flex;gap:8px;flex-wrap:wrap;padding:16px 0 0}
/* old views */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.err{color:var(--red);margin-top:10px;font-size:14px}
.person{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line2);font-size:13.5px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:10px 0}label.l{font-size:12px;color:var(--muted);display:block;margin:0 0 4px}
.stat{display:inline-block;margin:0 22px 8px 0}.stat b{font-size:22px;display:block}
.card>h2,.card>h3{margin:0 0 8px}.card>p{margin:6px 0 10px}
.login{max-width:420px;margin:14vh auto;padding:28px}.login h1{margin:0 0 6px}.login .btn{width:100%;margin-top:6px;padding:11px}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}.g21{grid-template-columns:1fr}}
@media(max-width:900px){
.shell{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:50;transform:translateX(-100%);transition:transform .25s cubic-bezier(.2,.9,.25,1)}
.nav-open .side{transform:none}.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(18,21,25,.4);z-index:49}
.burger{display:inline-flex}.bar{padding:10px 14px;flex-wrap:wrap}.bar .bx{width:100%;justify-content:flex-start}.bar .bx .srch{flex:1}.page{padding:14px 12px 50px}
.g2,.g3{grid-template-columns:1fr}.fbar{padding:10px 12px}.fbar .srch{flex:1 1 100%}.card{padding:16px}.card.flush .dt td:first-child,.card.flush .dt th:first-child{padding-left:12px}

}
@media(max-width:520px){.kpis{grid-template-columns:1fr 1fr;gap:8px}.kpi{padding:12px;min-height:92px}.kpi b{font-size:20px}.spk{display:none}.hl{grid-template-columns:1fr auto}.hl small{display:none}}

    var done = function (r, after) { S.busy = false; if (r.ok || r.vouchers || r.total != null) { if (after) after(r); } else fail(r); };
    if (act === 'invite') { var em2 = t.dataset.email || prompt('E-mail of the person to invite:'); if (!em2) return; if (!confirm('Send the portal invite to ' + em2 + '?')) return; api('invite', { company: id, email: em2 }).then(function (r) { done(r, function () { S.err = ''; alert('Invite sent to ' + em2 + '.'); loadProspects(); }); }); }
    if (act === 'imp-prev' || act === 'imp-run') {
      var g = grp('imp'); S.ex.imp = g; var filters = { tiers: g.tiers, types: g.types, countries: g.countries, states: g.states, name: g.name, boughtWithinMonths: g.boughtWithinMonths, notBoughtWithinMonths: g.notBoughtWithinMonths, hasEmail: g.hasEmail };
      if (act === 'imp-run' && !g.segment) { S.err = 'Give the segment a name first.'; return draw(); }
      if (act === 'imp-run' && !confirm('Create these customers as prospects in segment "' + g.segment + '"? No e-mail is sent.')) return;
      S.busy = true; S.ex.done = ''; draw();
      api(act === 'imp-prev' ? 'import-preview' : 'import', act === 'imp-prev' ? { filters: filters } : { filters: filters, segment: g.segment }).then(function (r) { done(r, function () { if (act === 'imp-prev') S.ex.prev = r; else { S.ex.done = r.created + ' new prospects created, ' + r.alreadyThere + ' were already in the portal, ' + r.matched + ' in segment "' + r.segment + '".'; S.ex.prev = null; loadTab('import'); } draw(); }); });
    }
    if (act === 'seg-edit') { S.ex.seg = S.ex.seg === id ? null : id; return draw(); }
    if (act === 'seg-save') { var sg = grp('sg'); sg.name = t.dataset.name; api('segment-save', sg).then(function (r) { done(r, function () { S.ex.seg = null; loadTab('import'); }); }); }
    if (act === 'tm-save') { var tm = grp('tm'); S.ex.tmv = tm.version; S.ex.tmb = document.getElementById('tmb').value; api('terms-save', { version: tm.version, body: S.ex.tmb }).then(function (r) { done(r, function () { loadTab('terms'); }); }); }
    if (act === 'tm-load') { var tv = S.terms.filter(function (x) { return x.version === t.dataset.v; })[0]; S.ex.tmv = tv.version + (tv.status === 'draft' ? '' : '-2'); S.ex.tmb = tv.body; return draw(); }
    if (act === 'tm-pub') { if (!confirm('Publish terms ' + t.dataset.v + '? Customers will be asked to accept this text. A published version cannot be edited.')) return; api('terms-publish', { version: t.dataset.v }).then(function (r) { done(r, function () { loadTab('terms'); }); }); }
    if (act === 'v-save') {
      var v = grp('v'); S.ex.v = Object.assign({}, S.ex.v || {}, v);
      var body = { id: (S.ex.v || {}).id, code: v.code, description: v.description, kind: v.kind, value: v.value, min_subtotal: v.min_subtotal, max_uses: v.max_uses, max_uses_per_company: v.max_uses_per_company, company_id: (S.ex.v || {}).company_id || '', company_code: v.company_code, starts_at: v.starts_at ? new Date(v.starts_at + 'T00:00:00').toISOString() : '', expires_at: v.expires_at ? new Date(v.expires_at + 'T23:59:59').toISOString() : '' };
      api('voucher-save', body).then(function (r) { done(r, function () { S.ex.v = {}; loadTab('vouchers'); }); });
    }
    if (act === 'v-new') { S.ex.v = {}; return draw(); }
    if (act === 'v-edit') { var vv = S.vouchers.filter(function (x) { return x.id === id; })[0]; S.ex.v = Object.assign({}, vv, { company_code: '' }); return draw(); }
    if (act === 'v-tog') { api('voucher-toggle', { id: id, active: !!t.dataset.on }).then(function (r) { done(r, function () { loadTab('vouchers'); }); }); }
    if (act === 'hd-hide' || act === 'hd-show') { var hd = grp('hd'); S.ex.hd = hd; if (act === 'hd-hide' && !confirm('Hide these products from every customer?')) return; api('hidden-set', { hide: act === 'hd-hide', codes: hd.codes, reason: hd.reason }).then(function (r) { done(r, function () { S.ex.hd = {}; loadTab('products'); }); }); }
    if (act === 'ly-save') { var ly = grp('ly'); api('loyalty-save', ly).then(function (r) { done(r, function () { loadTab('loyalty'); }); }); }
    if (act === 'ad-save') { var ad = grp('ad'); api('admin-save', { email: ad.email, name: ad.name, role: ad.role, active: true }).then(function (r) { done(r, function () { S.ex.ad = {}; loadTab('admins'); }); }); }
    if (act === 'ad-edit') { S.ex.ad = S.adm.admins.filter(function (x) { return x.email === t.dataset.e; })[0]; return draw(); }
    if (act === 'ad-tog') { var ax = S.adm.admins.filter(function (x) { return x.email === t.dataset.e; })[0]; api('admin-save', { email: ax.email, name: ax.name, role: ax.role, active: !ax.active }).then(function (r) { done(r, function () { loadTab('admins'); }); }); }
  });
  app.addEventListener('change', function (e) { if (e.target.dataset.chg) { setM(e.target.dataset.chg, e.target.value); return draw(); } if (e.target.dataset.actChange === 'days') { S.days = +e.target.value; if (S.tab === 'dash') { S.dash = null; draw(); loadTab('dash'); } else { S.ev = null; draw(); loadTab('events'); } } });
  (function () {
  })();
  function boot() { api('me').then(function (m) { if (m._status === 200) { S.me = m; load(); if (S.tab === 'dash') { if (m.role === 'superadmin' || m.role === 'sales' || m.role === 'marketing') loadTab('dash'); } } else { S.me = null; if (m._status === 503) S.err = 'Admin is not enabled in this environment yet.'; draw(); } }); }
  var lt = location.search.match(/[?&]lt=([^&]+)/);
  if (lt) { S.lt = decodeURIComponent(lt[1]); history.replaceState(null, '', location.pathname); draw(); } else boot();
})();
</script>
